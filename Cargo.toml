# Workspace only. The `tree-feller` crate itself lives in `lib/`, beside the C
# sources it has to ship: `cargo package` collects nothing above the manifest
# directory, so a manifest anywhere else would publish bindings with no library
# behind them. Same reason tree-sitter puts its crate in `lib/`.
[workspace]
members = ["lib", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Dekker1/tree-feller"

[workspace.dependencies]
tree-feller = { path = "lib" }
tree-sitter = "=0.27.0"
tree-sitter-language = "0.1"
# Grammars that load: ABI 15, no external scanner.
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-regex = "0.25"
tree-sitter-solidity = "1.2"
# Its parser.c is byte-identical to the commit pinned by CMake.
tree-sitter-systemverilog = "=0.4.0"
# Not on crates.io, but they are proper crates in the shackle repository, pinned
# to the commit the C tests fetch their tables from.
tree-sitter-datazinc = { git = "https://github.com/shackle-rs/shackle", rev = "03b6430" }
tree-sitter-minizinc = { git = "https://github.com/shackle-rs/shackle", rev = "03b6430" }
