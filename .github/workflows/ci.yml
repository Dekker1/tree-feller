name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  c:
    name: C / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched grammars
        uses: actions/cache@v4
        with:
          path: build/_grammars
          key: grammars-${{ hashFiles('cmake/TreeFellerGrammars.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install and consume
        if: runner.os != 'Windows'
        run: |
          cmake --install build --prefix "$PWD/_install"
          test -f _install/lib/libtree_feller.a
          test -f _install/include/tree_feller.h
          test -f _install/lib/cmake/tree_feller/tree_feller-config.cmake

  rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install clang tooling
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: clang-format
        run: |
          git ls-files '*.c' '*.h' | xargs clang-format --dry-run -Werror

      # clang-tidy needs a compilation database, which needs the grammars.
      - name: Cache fetched grammars
        uses: actions/cache@v4
        with:
          path: build/_grammars
          key: grammars-${{ hashFiles('cmake/TreeFellerGrammars.cmake') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: clang-tidy
        run: |
          git ls-files 'src/*.c' 'tools/*.c' 'tests/test_*.c' 'bench/*.c' \
            | xargs clang-tidy -p build --warnings-as-errors='*'

  # Test again under with sanitizers.
  sanitize:
    name: Sanitize
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched grammars
        uses: actions/cache@v4
        with:
          path: build/_grammars
          key: grammars-${{ hashFiles('cmake/TreeFellerGrammars.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  # Package it and build the Rust crate.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package
      - name: Test the packaged crate
        run: |
          cd target/package/tree-feller-*/
          cargo test
